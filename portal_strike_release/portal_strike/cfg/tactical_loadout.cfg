// ==============================================================
//  Portal Strike: Authentic Tactical Skirmish Loadout
// ==============================================================
sv_cheats 1

// Global Model Bounds & Consistency Exemptions (Ported Portal Assets)
sv_consistency 0
sv_pure 0
sv_pure_kick 0
sv_pure_trace 0

// 1. Natural Movement Controls & Binding Resets (Strip movement hooks)
alias +ps_forward ""
alias -ps_forward ""
alias +ps_back ""
alias -ps_back ""
alias +ps_moveleft ""
alias -ps_moveleft ""
alias +ps_moveright ""
alias -ps_moveright ""

-forward
-back
-moveleft
-moveright
-jump
-duck
-speed

bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"

// 2. Lock Native Portal Controls (Blue / Orange Portals)
-attack
-attack2
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"

// 3. Aperture HEV Armor & Tactical Suit
give item_suit
give item_battery
give item_battery
give item_battery
give item_battery
give item_healthkit

// 4. Aperture Handheld Portal Device (Dual-Portal Upgrade)
give weapon_portalgun
upgrade_portalgun
use weapon_portalgun

// 5. Authentic Counter-Strike: Source Tactical Arsenal
// Melee & Sidearms
give weapon_knife
give weapon_usp
give weapon_glock18
give weapon_deagle
give weapon_p228
give weapon_elite
give weapon_fiveseven

// Submachine Guns
give weapon_mp5navy
give weapon_tmp
give weapon_mac10
give weapon_ump45
give weapon_p90

// Assault & Tactical Rifles
give weapon_galil
give weapon_famas
give weapon_ak47
give weapon_m4a1
give weapon_sg552
give weapon_aug

// Precision Sniper Rifles
give weapon_scout
give weapon_awp
give weapon_g3sg1
give weapon_sg550

// Tactical Shotguns & Heavy Support
give weapon_m3
give weapon_xm1014
give weapon_m249

// Tactical Ordnance
give weapon_hegrenade
give weapon_flashbang
give weapon_smokegrenade

// 6. Tactical Ammunition Reserves
give item_ammo_pistol_large
give item_ammo_smg1_large
give item_ammo_ar2_large
give item_box_buckshot
give item_ammo_357_large

// 7. Equip Aperture Handheld Portal Device as Default Primary
use weapon_portalgun

echo "[Portal Strike] Tactical Loadout active: ASHPD (Blue/Orange) & CS:S Arsenal equipped!"
echo "[Portal Strike] Controls locked: MOUSE1=Blue, MOUSE2=Orange, W/A/S/D natural movement."
